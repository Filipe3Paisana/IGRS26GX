#
# kamailio.cfg – ConferenceControl 2.0 (Grupo 10)
# Baseado em labs/lab4/scripts/app.cfg. Toda a lógica de encaminhamento está em
# Python (KEMI): este ficheiro só carrega os módulos e aponta para src/kamailio.py.
#

####### Parâmetros globais #########
debug=2
log_stderror=yes
fork=yes
children=4
listen=udp:eth0:5060

# Nome do domínio servido por este proxy. Com o alias, o Kamailio considera
# "acme.operador" como ele próprio (necessário, p.ex., para o loose_route
# reconhecer cabeçalhos Route que apontam para nós).
alias="acme.operador"

####### Módulos ########
mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/"
loadmodule "tm"          # encaminhamento com estado (transações)
loadmodule "rr"          # Record-Route / loose routing (ficar no caminho do diálogo)
loadmodule "usrloc"      # base de dados de localizações (registos)
loadmodule "registrar"   # REGISTER: save / lookup
loadmodule "kex"
loadmodule "kemix"
loadmodule "app_python3" # motor KEMI em Python
loadmodule "sl"          # respostas sem estado (stateless)
loadmodule "pv"          # pseudo-variáveis ($rm, $fd, $tu, ...)
loadmodule "uac"         # pedidos gerados pelo proxy (ex.: MESSAGE ao leader)

modparam("usrloc", "preload", "location")
modparam("uac", "reg_contact_addr", "127.0.0.1:5060")

# O código do projeto é montado em /etc/kamailio/igrs (ver compose.yaml).
# O app_python3 junta essa pasta ao sys.path, por isso os outros módulos
# (registo, sala_comum, ...) podem ser importados diretamente.
modparam("app_python3", "load", "/etc/kamailio/igrs/kamailio.py")
cfgengine "python"
